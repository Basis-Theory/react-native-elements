name: Release

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, no leading v (e.g. 3.1.0)"
        required: true
        type: string
      npm_dist_tag:
        description: "npm dist-tag to publish under. Cannot be 'latest' - that tag tracks the mainline major."
        required: true
        default: v3-lts
        type: string
      dry_run:
        description: "Build and validate without publishing, tagging, or pushing"
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write # Required for OIDC trusted publishing to npm
      contents: write
      actions: read
    environment: PROD # Must match npm trusted publisher config exactly (case-sensitive)
    strategy:
      matrix:
        node: ["20.x"]
        os: [ubuntu-latest]
    env:
      CI: 1
    steps:
      - name: Mint semantic-release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout Repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Resolve Release Parameters
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DIST_TAG: ${{ inputs.npm_dist_tag }}
        run: node scripts/release.js resolve-params

      - name: Start Deploy Message
        uses: Basis-Theory/public-github-actions/deploy-slack-action@12362db6b1ad6b524d28c47a6489c3e73ecd656a # master
        with:
          slack-api-token: ${{ secrets.SLACK_DUCKBOT_API_KEY }}
          channel: ${{ vars.SLACK_DUCKBOT_RELEASE_CHANNEL_ID }}

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          # registry-url is intentionally NOT set - it creates .npmrc that blocks OIDC

      - name: Update npm for Trusted Publishing
        run: npm install -g npm@11.18.0 # Pinned: npm 11.5.1+ needed for OIDC, Node 20 compatible (npm 12+ requires Node 22+)

      - name: Install deps
        run: yarn --immutable --no-progress --ignore-scripts

      - name: Bump Version
        env:
          VERSION: ${{ steps.params.outputs.version }}
        run: make update-version NEW_VERSION="$VERSION"

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Update CHANGELOG (conventional-changelog)
        env:
          VERSION: ${{ steps.params.outputs.version }}
        run: node scripts/release.js update-changelog

      - name: Build
        run: make build
        env:
          SKIP_INSTALL: 1 # install with cache was done already

      - name: Verify Version Is Publishable
        id: publishable
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          VERSION: ${{ steps.params.outputs.version }}
        run: node scripts/release.js verify-publishable

      - name: Publish Package to NPM
        if: ${{ steps.publishable.outputs.already_published != 'true' }}
        env:
          NPM_DIST_TAG: ${{ steps.params.outputs.npm_dist_tag }}
          NPM_DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/release.js publish

      - name: Commit Version to Repo
        if: ${{ !inputs.dry_run }}
        env:
          TARGET_BRANCH: ${{ steps.params.outputs.target_branch }}
        run: node scripts/release.js commit-version

      - name: Tag and Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.params.outputs.version }}
          NPM_DIST_TAG: ${{ steps.params.outputs.npm_dist_tag }}
        run: node scripts/release.js create-github-release

      - name: Stop Deploy Message
        if: always()
        uses: Basis-Theory/public-github-actions/deploy-slack-action@12362db6b1ad6b524d28c47a6489c3e73ecd656a # master
        with:
          slack-api-token: ${{ secrets.SLACK_DUCKBOT_API_KEY }}
          channel: ${{ vars.SLACK_DUCKBOT_RELEASE_CHANNEL_ID }}
          status: "done"
